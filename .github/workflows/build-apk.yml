name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Web Assets to Capacitor
        run: |
          mkdir -p www
          cp -r assets www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r data www/ 2>/dev/null || true
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Ingilizce_Cumle_Fabrikasi.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ingilizce_Cumle_Fabrikasi_APK
          path: release-apk/Ingilizce_Cumle_Fabrikasi.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "İngilizce Cümle Fabrikası Güncel APK"
          body: |
            🎉 **İngilizce Cümle Fabrikası & 80 Fiil (SVOMPT)** Android APK Derlemesi

            - **Otomatik Derleme:** GitHub Actions üzerinden oluşturuldu.
            - **İçerik:** 80+ Fiil, 17 Modül Gramer, SVOMPT Cümle Fabrikası, Ela'nın Hikayesi ve Sınav Arenası.
            
            📲 Aşağıdaki **Ingilizce_Cumle_Fabrikasi.apk** dosyasına tıklayarak doğrudan telefonunuza indirip kurabilirsiniz!
          files: release-apk/Ingilizce_Cumle_Fabrikasi.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
